log, idempotency keys, replay, then deliberately break last-write-wins."},{"kind":"p","text":"Alongside the milestones they agreed an **exploration track** (2026-08-05): pick constraints where the ecosystem default genuinely breaks, state a falsifiable success condition before starting, and treat an exploration as finished only when something broke and was understood. Lab code lives in a **pnpm workspace** rooted at `setup/` with both repos as members. First exploration agreed: **`fast-check` against their own codemod**, asserting idempotence, no-silent-loss, skip-safety, and semantic preservation."},{"kind":"p","text":"**Why:** they endorsed the framing that you only get good at the shape of problems you're handed, and picked all four rather than one. Milestone 2 is the real prize — it is what makes the two repos one system."},{"kind":"p","text":"**How to apply:** when they return to this thread of work, resume at milestone 3 rather than re-proposing the sequence. Do not start a later milestone first — the ordering was a deliberate decision, not a preference."}]}]},{"group":"Memories","title":"js / web / real / estate-backend","path":"C:/Users/emman/.claude/projects/c--Users-emman-Downloads-Personal-js-web-real-estate-backend/memory","sections":[{"heading":"fix-only-what-was-reported","level":2,"memory":true,"description":"When the user reports one specific UI defect, change only that property — don't bundle in other \"improvements\" you notice in the same file","type":"feedback","file":"fix-only-what-was-reported.md","blocks":[{"kind":"p","text":"When the user names a single concrete defect (\"the gap is too much\"), change only the property that causes it. Do not fold in adjacent fixes you spot while in the file — even ones based on preferences they stated earlier in other contexts."},{"kind":"p","text":"**Why:** Fixing the gap AND swapping a border token in the same edit meant the user got an unrequested visual change and had to interrupt to undo it. A previously-stated preference is not standing permission to apply it wherever it seems to fit."},{"kind":"p","text":"**How to apply:** Make the reported fix. If you notice something else worth changing, mention it in the response as a question, never in the diff."}]}]},{"group":"Memories","title":"js / web / travel-backend","path":"C:/Users/emman/.claude/projects/c--Users-emman-Downloads-Personal-js-web-travel-backend/memory","sections":[{"heading":"git-commit-push-one-chain","level":2,"memory":true,"description":"When asked to commit and push, chain both into a single Bash command — never separate permission prompts","type":"feedback","file":"git-commit-push-one-chain.md","blocks":[{"kind":"p","text":"When the request is \"commit then push\" (or any multi-step git sequence), run it as ONE chained Bash command — `git add -A && git commit -F \u003cmsgfile> && git push origin \u003cbranch>` — not as separate tool calls."},{"kind":"p","text":"**Why:** the user reads \"batch ... commit all in one go then push\" as one permission chain. Splitting commit and push into two prompts makes them approve the same intent twice, and they will reject the second call."},{"kind":"p","text":"**How to apply:** do any diff scans up front as their own calls, then write the commit message to a scratchpad file and issue a single chained command for add + commit + push. Long commit messages go in a file rather than a heredoc so the chain stays a one-liner."}]}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const KEY = "rules-review:marked";
let marked = new Set();
try { marked = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...marked])); } catch (e) {} };

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = (s) => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
  .replace(/\[\[([^\]]+)\]\]/g, '<span class="link">[[$1]]</span>')
  .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:]|$)/g, "$1<em>$2</em>")
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g, "$1<em>$2</em>");

document.getElementById("gen").textContent = DATA.generated;
const nav = document.getElementById("nav");
const main = document.getElementById("main");
const blockIndex = [];

let lastGroup = "";
DATA.sources.forEach((src, si) => {
  if (src.group !== lastGroup) {
    const g = document.createElement("div"); g.className = "nav-group"; g.textContent = src.group; nav.append(g); lastGroup = src.group;
  }
  const a = document.createElement("a"); a.href = "#s" + si;
  const flags = src.sections.reduce((n, s) => n + s.blocks.filter((b) => b.flag).length, 0);
  a.innerHTML = `<span>${esc(src.title)}${flags ? `<span class="f" title="flagged lines">⚑${flags}</span>` : ""}</span><span class="n" id="n${si}"></span>`;
  nav.append(a);

  const box = document.createElement("section"); box.className = "source"; box.id = "s" + si;
  box.innerHTML = `<div class="head"><h2>${esc(src.title)}</h2><span class="path">${esc(src.path)}</span></div>`;
  src.sections.forEach((sec, ci) => {
    const wrap = document.createElement("div"); wrap.className = "section";
    const head = document.createElement("div"); head.className = "sec-head";
    const tag = sec.memory && sec.type ? `<span class="tag">${esc(sec.type)}</span>` : "";
    const desc = sec.description ? `<span class="desc">${inline(sec.description)}</span>` : "";
    head.innerHTML = `<h3 class="${sec.level >= 3 ? "l3" : ""}">${tag}${inline(sec.heading)}${desc}</h3>`;
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "sec-btn";
    btn.textContent = sec.memory ? "Remove memory" : "Remove section";
    head.append(btn); wrap.append(head);
    const ul = document.createElement("ul"); ul.className = "blocks";
    const ids = [];
    sec.blocks.forEach((b) => {
      const id = `${src.path}|${sec.file || sec.heading}|${b.text}`;
      ids.push(id);
      const li = document.createElement("li");
      li.className = `block ${b.kind} d${b.depth || 0}${b.flag ? " flagged" : ""}`;
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.setAttribute("aria-label", "Mark for removal");
      const txt = document.createElement("div"); txt.className = "txt";
      if (b.kind === "li") txt.dataset.marker = /^\d/.test(b.marker) ? b.marker : "•";
      txt.innerHTML = b.cells ? `<div class="cells">${b.cells.map((c) => `<span>${inline(c)}</span>`).join("")}</div>` : inline(b.text);
      if (b.flag) { const f = document.createElement("div"); f.className = "flag"; f.textContent = b.flag; txt.append(f); }
      li.append(cb, txt); ul.append(li);
      const entry = { id, li, cb, src, sec, block: b, si };
      blockIndex.push(entry);
      li.addEventListener("click", (e) => { if (e.target !== cb) cb.checked = !cb.checked; set(entry, cb.checked); });
    });
    if (!sec.blocks.length) ul.innerHTML = `<li class="empty">No body text in this section.</li>`;
    btn.addEventListener("click", () => {
      const all = ids.length && ids.every((i) => marked.has(i));
      blockIndex.filter((e) => e.src === src && e.sec === sec).forEach((e) => { e.cb.checked = !all; set(e, !all, true); });
      refresh();
    });
    sec._btn = btn; sec._ids = ids;
    wrap.append(ul); box.append(wrap);
  });
  main.append(box);
});

function set(entry, on, quiet) {
  on ? marked.add(entry.id) : marked.delete(entry.id);
  entry.li.classList.toggle("marked", on);
  if (!quiet) refresh();
}

function refresh() {
  save();
  document.getElementById("count").textContent = marked.size;
  document.getElementById("copy").disabled = marked.size === 0;
  DATA.sources.forEach((src, si) => {
    const n = blockIndex.filter((e) => e.si === si && marked.has(e.id)).length;
    const total = blockIndex.filter((e) => e.si === si).length;
    const el = document.getElementById("n" + si);
    el.textContent = n ? `${n}/${total}` : total; el.classList.toggle("hot", n > 0);
    src.sections.forEach((sec) => sec._btn.setAttribute("aria-pressed", String(sec._ids.length > 0 && sec._ids.every((i) => marked.has(i)))));
  });
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const only = document.getElementById("onlyMarked").checked;
  const flaggedOnly = document.getElementById("onlyFlagged").checked;
  blockIndex.forEach((e) => {
    const hay = (e.block.text + " " + e.sec.heading + " " + (e.sec.description || "")).toLowerCase();
    e.li.classList.toggle("hidden-by-filter", (q && !hay.includes(q)) || (only && !marked.has(e.id)) || (flaggedOnly && !e.block.flag));
  });
  document.querySelectorAll(".section").forEach((s) => {
    const any = s.querySelector(".block:not(.hidden-by-filter)") || (!q && !only && !flaggedOnly && s.querySelector(".empty"));
    s.classList.toggle("hidden-by-filter", !any);
  });
  document.querySelectorAll(".source").forEach((s) => s.classList.toggle("hidden-by-filter", !s.querySelector(".section:not(.hidden-by-filter)")));
}

function buildList() {
  const lines = [];
  DATA.sources.forEach((src) => {
    const picks = blockIndex.filter((e) => e.src === src && marked.has(e.id));
    if (!picks.length) return;
    lines.push(`## ${src.title} — ${src.path}`);
    src.sections.forEach((sec) => {
      const inSec = picks.filter((e) => e.sec === sec);
      if (!inSec.length) return;
      const whole = inSec.length === sec._ids.length;
      const label = sec.memory ? `memory ${sec.file}` : `section "${sec.heading}"`;
      lines.push(whole ? `- REMOVE ENTIRE ${label}` : `- In ${label}, remove:`);
      if (!whole) inSec.forEach((e) => lines.push("    > " + (e.block.raw || e.block.text).replace(/\n/g, "\n    > ")));
    });
    lines.push("");
  });
  return lines.join("\n").trim();
}

async function copy(text) {
  const status = document.getElementById("status");
  try { await navigator.clipboard.writeText(text); status.textContent = "Copied"; }
  catch (e) { const t = document.getElementById("out"); t.focus(); t.select(); status.textContent = "Press Ctrl+C to copy"; }
}

const dlg = document.getElementById("dlg");
document.getElementById("copy").addEventListener("click", () => {
  const text = buildList(); document.getElementById("out").value = text;
  document.getElementById("status").textContent = "";
  dlg.showModal(); copy(text);
});
document.getElementById("copyAgain").addEventListener("click", () => copy(document.getElementById("out").value));
document.getElementById("close").addEventListener("click", () => dlg.close());
document.getElementById("clear").addEventListener("click", () => {
  if (!marked.size) return;
  blockIndex.forEach((e) => { e.cb.checked = false; e.li.classList.remove("marked"); });
  marked.clear(); refresh();
});
document.getElementById("q").addEventListener("input", applyFilter);
document.getElementById("onlyMarked").addEventListener("change", applyFilter);
document.getElementById("onlyFlagged").addEventListener("change", applyFilter);
document.getElementById("flagTotal").textContent = "(" + blockIndex.filter((e) => e.block.flag).length + ")";

blockIndex.forEach((e) => { if (marked.has(e.id)) { e.cb.checked = true; e.li.classList.add("marked"); } });
refresh();
</script>
</body>
</html>
