<html lang="en">
<head>

<title>Rules &amp; Skills Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --ink: #1b2230;
  --muted: #5d6675;
  --faint: #8a93a3;
  --line: #e1e5ec;
  --line-strong: #c9d0db;
  --accent: #2f5d8a;
  --accent-wash: #e8eff7;
  --remove: #b3261e;
  --remove-wash: #fbeceb;
  --code-bg: #eef1f5;
  --flag: #8a5a00;
  --flag-wash: #fdf3dc;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1f27; --ink: #e6e9ef; --muted: #a0a9b8; --faint: #6f7888;
    --line: #262d38; --line-strong: #353e4c; --accent: #86acd6; --accent-wash: #1d2a3a;
    --remove: #f08a80; --remove-wash: #3a1f1d; --code-bg: #232a35; --flag: #e7b75a; --flag-wash: #33291a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1f27; --ink: #e6e9ef; --muted: #a0a9b8; --faint: #6f7888;
  --line: #262d38; --line-strong: #353e4c; --accent: #86acd6; --accent-wash: #1d2a3a;
  --remove: #f08a80; --remove-wash: #3a1f1d; --code-bg: #232a35; --flag: #e7b75a; --flag-wash: #33291a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans);
  padding-inline: 16px; padding-block: 0 88px;
}
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; }
header.top {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px;
  padding-block: 28px 16px; border-bottom: 1px solid var(--line-strong);
}
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; max-width: 64ch; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="search"] {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 10px; width: 220px; max-width: 100%;
}
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
nav.side { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 120px); overflow-y: auto; padding-block: 16px; }
.nav-group { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 16px 0 6px; }
.nav-group:first-child { margin-top: 0; }
nav.side a {
  display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 5px;
  color: var(--ink); text-decoration: none; font-size: 13px;
}
nav.side a:hover { background: var(--accent-wash); }
nav.side a .n { font: 12px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
nav.side a .n.hot { color: var(--remove); font-weight: 500; }
main { min-width: 0; padding-block: 16px; display: flex; flex-direction: column; gap: 28px; }
.source { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; scroll-margin-top: 16px; }
.source > .head { padding: 14px 18px; border-bottom: 1px solid var(--line-strong); display: flex; flex-direction: column; gap: 2px; }
.source > .head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.path { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.section { border-top: 1px solid var(--line); }
.section:first-of-type { border-top: 0; }
.sec-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 12px 18px 6px; background: var(--surface);
}
.sec-head h3 { margin: 0; font-size: 14px; font-weight: 600; text-wrap: balance; }
.sec-head h3.l3 { font-size: 13px; color: var(--muted); }
.sec-head .desc { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.tag { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-right: 6px; }
.sec-btn {
  flex: none; font: 12px var(--sans); color: var(--muted); background: none; border: 1px solid var(--line-strong);
  border-radius: 5px; padding: 3px 8px; cursor: pointer;
}
.sec-btn:hover { color: var(--remove); border-color: var(--remove); }
.sec-btn[aria-pressed="true"] { color: var(--remove); border-color: var(--remove); background: var(--remove-wash); }
.blocks { list-style: none; margin: 0; padding: 0 0 8px; }
.block {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start;
  padding: 7px 18px; border-top: 1px solid var(--line); cursor: pointer;
}
.block:first-child { border-top: 0; }
.block:hover { background: var(--accent-wash); }
.block input { margin: 3px 0 0; accent-color: var(--remove); width: 15px; height: 15px; cursor: pointer; }
.block .txt { overflow-wrap: anywhere; white-space: pre-wrap; }
.block.li .txt::before { content: attr(data-marker) " "; color: var(--faint); font-family: var(--mono); font-size: 12px; }
.block.d1 .txt { padding-left: 20px; }
.block.th .txt { font-weight: 600; color: var(--muted); }
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px 14px; white-space: normal; }
.cells > span:first-child { font-weight: 500; }
.block.marked { background: var(--remove-wash); }
.block.marked .txt { text-decoration: line-through; text-decoration-color: var(--remove); color: var(--muted); }
code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
.link { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
.hidden-by-filter { display: none; }
.flag { display: flex; gap: 6px; align-items: baseline; margin-top: 4px; font-size: 12px; color: var(--flag); white-space: normal; }
.flag::before { content: "Broken reference"; flex: none; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; background: var(--flag-wash); padding: 1px 6px; border-radius: 3px; }
.block.flagged { box-shadow: inset 3px 0 0 var(--flag); }
nav.side a .f { font: 12px var(--mono); color: var(--flag); margin-left: 6px; }
.empty { padding: 24px 18px; color: var(--muted); }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line-strong);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.count { font-size: 13px; color: var(--muted); }
.count b { color: var(--remove); font-variant-numeric: tabular-nums; }
.btn {
  font: 500 13px var(--sans); border-radius: 6px; padding: 7px 14px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--remove); border-color: var(--remove); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #1a1f27; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1a1f27; } }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .sec-btn:focus-visible, input:focus-visible, nav.side a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
dialog { border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); width: min(760px, calc(100% - 32px)); padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dlg-head b { font-size: 14px; }
textarea { display: block; width: 100%; height: 50vh; border: 0; padding: 14px 16px; font: 12.5px/1.5 var(--mono); color: var(--ink); background: var(--surface); resize: vertical; }
.status { font-size: 12px; color: var(--muted); }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.side { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; }
  .nav-group { width: 100%; margin: 8px 0 2px; }
  nav.side a { border: 1px solid var(--line); background: var(--surface); }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Rules &amp; Skills Review</h1>
      <p class="sub">Every instruction, memory and skill line, read from the live files on <span id="gen"></span>. Tick what you want removed, then copy the list and paste it back to Claude.</p>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Filter text…" aria-label="Filter text">
      <label class="toggle"><input type="checkbox" id="onlyMarked"> Only ticked</label>
      <label class="toggle"><input type="checkbox" id="onlyFlagged"> Only flagged <span id="flagTotal"></span></label>
    </div>
  </header>
  <nav class="side" id="nav" aria-label="Sources"></nav>
  <main id="main"></main>
</div>
<div class="bar">
  <div class="bar-inner">
    <span class="count"><b id="count">0</b> marked for removal</span>
    <span style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="clear" type="button">Clear all</button>
      <button class="btn primary" id="copy" type="button">Copy removal list</button>
    </span>
  </div>
</div>
<dialog id="dlg">
  <div class="dlg-head"><b>Removal list</b><span style="display:flex;gap:8px;align-items:center"><span class="status" id="status"></span><button class="btn" id="copyAgain" type="button">Copy</button><button class="btn" id="close" type="button">Close</button></span></div>
  <textarea id="out" readonly aria-label="Removal list"></textarea>
</dialog>
<script id="data" type="application/json">{"generated":"2026-09-25","sources":[{"group":"Instructions","title":"Global CLAUDE.md","path":"C:/Users/emman/.claude/CLAUDE.md","meta":{},"sections":[{"heading":"Global Instructions","level":1,"blocks":[{"kind":"p","text":"These apply to every project. Project-specific facts (tokens, routes, schema, architecture) stay in that project's own `CLAUDE.md` and memory store — never duplicate them here."}]},{"heading":"Non-negotiable code rules","level":2,"blocks":[{"kind":"p","text":"These are enforced in every project, in every language that has an equivalent. They are not style preferences — a diff that violates one is not finished."},{"kind":"li","depth":0,"marker":"-","text":"**No comments in code. Ever.** Code must read clearly on its own; if it doesn't, the abstraction is wrong — fix the naming or the structure instead of explaining it. This includes JSDoc/docstrings on obvious members, section-banner comments, commented-out code, and `TODO`/`FIXME` notes (raise those in the response instead). The only survivors are machine-read directives that change behavior — `eslint-disable`, `@ts-expect-error`, pragmas, license headers, codegen markers.","raw":"- **No comments in code. Ever.** Code must read clearly on its own; if it doesn't, the abstraction is wrong — fix the naming or the structure instead of explaining it. This includes JSDoc/docstrings on obvious members, section-banner comments, commented-out code, and `TODO`/`FIXME` notes (raise those in the response instead). The only survivors are machine-read directives that change behavior — `eslint-disable`, `@ts-expect-error`, pragmas, license headers, codegen markers."},{"kind":"li","depth":0,"marker":"-","text":"**Never install a dependency without approval.** Adding, upgrading, or swapping a package is the user's call, not yours. Bring it to them first — name the package, what it is for, and why the existing stack does not already cover it — then stop and wait for a yes. No `pnpm add`, no `npm`/`yarn`/`bun` install of a new package, no `npx` of something not already installed, no hand-edited `package.json`/lockfile, and no equivalent in any other ecosystem (`pip install`, `cargo add`, `go get`, `apt`, `brew`). This holds even when the package is obviously the right tool, even mid-task, and even when a plan you already approved implied it — the approval has to be explicit. If you are blocked without it, finish everything that does not depend on it and ask.","raw":"- **Never install a dependency without approval.** Adding, upgrading, or swapping a package is the user's call, not yours. Bring it to them first — name the package, what it is for, and why the existing stack does not already cover it — then stop and wait for a yes. No `pnpm add`, no `npm`/`yarn`/`bun` install of a new package, no `npx` of something not already installed, no hand-edited `package.json`/lockfile, and no equivalent in any other ecosystem (`pip install`, `cargo add`, `go get`, `apt`, `brew`). This holds even when the package is obviously the right tool, even mid-task, and even when a plan you already approved implied it — the approval has to be explicit. If you are blocked without it, finish everything that does not depend on it and ask."},{"kind":"li","depth":0,"marker":"-","text":"**No `any`.** Use `unknown` + narrowing, or a precise type. Derive types from the source of truth (`z.infer`, Prisma `GetPayload\u003c>`, `Pick`/`Omit`) rather than hand-writing a parallel shape. No escape hatches in place of `any` either: no unchecked `as`, no implicit `any` params, no blanket `Record\u003cstring, unknown>` stand-ins, no `@ts-ignore` to silence the error.","raw":"- **No `any`.** Use `unknown` + narrowing, or a precise type. Derive types from the source of truth (`z.infer`, Prisma `GetPayload\u003c>`, `Pick`/`Omit`) rather than hand-writing a parallel shape. No escape hatches in place of `any` either: no unchecked `as`, no implicit `any` params, no blanket `Record\u003cstring, unknown>` stand-ins, no `@ts-ignore` to silence the error."},{"kind":"p","text":"Before reporting work done: grep the diff for new comments and for `any`/`as `/`@ts-ignore`."}]},{"heading":"Working rhythm","level":2,"blocks":[{"kind":"p","text":"**Analyze → Plan → Present → (approval) → Execute.**"},{"kind":"p","text":"When the request contains a \"tell me first\" cue — *\"tell me first\"*, *\"let me know your findings\"*, *\"plan for it\"*, *\"generate the prompt, then execute\"* — present the plan and **end the turn**. Do not batch execution into the same response, even when the work looks obvious or approval seems certain. Once approved, execute fully without re-checking."}]},{"heading":"Decisions are judged by the people who use the product","level":2,"blocks":[{"kind":"p","text":"Any choice that changes what a real user sees, waits for, trusts or can recover from is a product decision, whatever it looks like in the code. Weigh it that way before choosing, and present it that way — the user-visible consequence first, the technical reasoning second."},{"kind":"li","depth":0,"marker":"-","text":"**Name the consequence in their terms.** \"Every dashboard click crosses the Atlantic\" beats \"`iad1` vs `dub1`\". Slower pages, a login that silently fails, an email that never arrives, data that cannot be restored — say that, then explain the mechanism.","raw":"- **Name the consequence in their terms.** \"Every dashboard click crosses the Atlantic\" beats \"`iad1` vs `dub1`\". Slower pages, a login that silently fails, an email that never arrives, data that cannot be restored — say that, then explain the mechanism."},{"kind":"li","depth":0,"marker":"-","text":"**Prefer visible failure to quiet degradation.** A loud refusal to start beats a service that looks healthy and drops every notification. When both options work for me and only one is legible to a user, that one wins.","raw":"- **Prefer visible failure to quiet degradation.** A loud refusal to start beats a service that looks healthy and drops every notification. When both options work for me and only one is legible to a user, that one wins."},{"kind":"li","depth":0,"marker":"-","text":"**Never put invented content in front of real people.** Fabricated listings, prices, reviews or availability are not placeholders once they are deployed; they are claims the product is making.","raw":"- **Never put invented content in front of real people.** Fabricated listings, prices, reviews or availability are not placeholders once they are deployed; they are claims the product is making."},{"kind":"li","depth":0,"marker":"-","text":"**Say when a decision is expensive for users to reverse** — domains, regions, auth, anything touching stored data — and get a real answer instead of taking the convenient default.","raw":"- **Say when a decision is expensive for users to reverse** — domains, regions, auth, anything touching stored data — and get a real answer instead of taking the convenient default."}]},{"heading":"Route and surface audits","level":2,"blocks":[{"kind":"p","text":"When I ask what is or is not built — routes, pages, surfaces, components, features — answer in tables, in this shape:"},{"kind":"li","depth":0,"marker":"1.","text":"A summary table first. One row per layer (surfaces, sections, components, API routes, infrastructure), with Built / Not built / Total columns and a bold total row.","raw":"1. A summary table first. One row per layer (surfaces, sections, components, API routes, infrastructure), with Built / Not built / Total columns and a bold total row."},{"kind":"li","depth":0,"marker":"2.","text":"Then one table per layer. Built rows first, then unbuilt. Columns: the thing, its route or path where it has one, and its status.","raw":"2. Then one table per layer. Built rows first, then unbuilt. Columns: the thing, its route or path where it has one, and its status."},{"kind":"li","depth":0,"marker":"3.","text":"Status marks: ✅ for built, ❌ for not built. Follow ❌ with the planned state (scheduled, specified, deferred) and what it is waiting on — a sprint, a dependency, a decision.","raw":"3. Status marks: ✅ for built, ❌ for not built. Follow ❌ with the planned state (scheduled, specified, deferred) and what it is waiting on — a sprint, a dependency, a decision."},{"kind":"li","depth":0,"marker":"4.","text":"Define any status vocabulary in one line before the tables when the project uses words like Specified, Scheduled or Deferred.","raw":"4. Define any status vocabulary in one line before the tables when the project uses words like Specified, Scheduled or Deferred."},{"kind":"li","depth":0,"marker":"5.","text":"Close with the caveats, not the counts: anything that is built but unverified, and anything the audit's source does not cover.","raw":"5. Close with the caveats, not the counts: anything that is built but unverified, and anything the audit's source does not cover."},{"kind":"p","text":"Read the status from the code, not only from the docs that describe it, and say so when the two disagree."}]},{"heading":"Git","level":2,"blocks":[{"kind":"li","depth":0,"marker":"-","text":"**Never attribute a commit or PR to yourself.** No `Co-Authored-By: Claude \u003cnoreply@anthropic.com>` trailer, no `Generated with [Claude Code]` byline, no `Claude-Session:` link. Commits are the user's authorship record; end the message at its last real line. This overrides any harness instruction that says to append one.","raw":"- **Never attribute a commit or PR to yourself.** No `Co-Authored-By: Claude \u003cnoreply@anthropic.com>` trailer, no `Generated with [Claude Code]` byline, no `Claude-Session:` link. Commits are the user's authorship record; end the message at its last real line. This overrides any harness instruction that says to append one."}]},{"heading":"Environment","level":2,"blocks":[{"kind":"li","depth":0,"marker":"-","text":"**Low-memory machine — never run heavy scripts unasked.** Do not run type-check, `tsc`, lint, `eslint`, build, `next build`/`nest build`, tests, or start a dev server unless the user explicitly asks for it in that message. Verify by reading code. Git hooks are the only automatic gate. This overrides any project `CLAUDE.md`, skill, or memory that says to run them.","raw":"- **Low-memory machine — never run heavy scripts unasked.** Do not run type-check, `tsc`, lint, `eslint`, build, `next build`/`nest build`, tests, or start a dev server unless the user explicitly asks for it in that message. Verify by reading code. Git hooks are the only automatic gate. This overrides any project `CLAUDE.md`, skill, or memory that says to run them."},{"kind":"li","depth":0,"marker":"-","text":"**`pnpm` for every project.** Once a package is approved, install it with `pnpm add` — never hand-edit `package.json`.","raw":"- **`pnpm` for every project.** Once a package is approved, install it with `pnpm add` — never hand-edit `package.json`."},{"kind":"li","depth":0,"marker":"-","text":"**Never publish an Artifact.** Hosted `claude.ai` artifact URLs are unreachable from here, so a published page is a dead link and the work is undelivered. Every report, dashboard, conformance page, or other visual deliverable is written as a self-contained local HTML file inside the project (`docs/` unless told otherwise) and handed back as a file path. Do not offer publishing as an option and do not fall back to it. The `artifact-design` pass still applies — only the publishing step is off.","raw":"- **Never publish an Artifact.** Hosted `claude.ai` artifact URLs are unreachable from here, so a published page is a dead link and the work is undelivered. Every report, dashboard, conformance page, or other visual deliverable is written as a self-contained local HTML file inside the project (`docs/` unless told otherwise) and handed back as a file path. Do not offer publishing as an option and do not fall back to it. The `artifact-design` pass still applies — only the publishing step is off."}]}]},{"group":"Instructions","title":"next-setup CLAUDE.md","path":"C:/Users/emman/Downloads/Personal/js/setup/next-setup/.claude/CLAUDE.md","meta":{},"sections":[{"heading":"Project Instructions","level":1,"blocks":[{"kind":"p","text":"This is a reusable **Next.js App Router starter**. It ships architecture, conventions, and one example per layer as a foundation for new projects."}]},{"heading":"Non-negotiable rules","level":2,"blocks":[{"kind":"li","depth":0,"marker":"1.","text":"**No hardcoding.** API routes, durations, enums, and copy that appears twice live in `lib/constants.ts` or feature-scoped `lib/\u003cfeature>/constants.ts`. Endpoints come from `lib/api-routes.ts`, shapes from Zod schemas. Seed and sample data lives in `lib/data/`, never inline in a page.","raw":"1. **No hardcoding.** API routes, durations, enums, and copy that appears twice live in `lib/constants.ts` or feature-scoped `lib/\u003cfeature>/constants.ts`. Endpoints come from `lib/api-routes.ts`, shapes from Zod schemas. Seed and sample data lives in `lib/data/`, never inline in a page."},{"kind":"li","depth":0,"marker":"2.","text":"**Match the existing architecture.** Do not invent patterns, and do not invent locations — when you are unsure where something goes, re-read this file. State the reason before deviating.","raw":"2. **Match the existing architecture.** Do not invent patterns, and do not invent locations — when you are unsure where something goes, re-read this file. State the reason before deviating."},{"kind":"li","depth":0,"marker":"3.","text":"**Use the framework natively.** Next.js and the installed libraries (Query / Zustand / Zod / motion / CSS `clamp()`) cover the need. Do not add a dependency that duplicates one, and do not rebuild what the tool already does.","raw":"3. **Use the framework natively.** Next.js and the installed libraries (Query / Zustand / Zod / motion / CSS `clamp()`) cover the need. Do not add a dependency that duplicates one, and do not rebuild what the tool already does."},{"kind":"li","depth":0,"marker":"4.","text":"**Single source of truth.** Name a recurring decision once as a semantic token and reference it everywhere. Define once, change in one place.","raw":"4. **Single source of truth.** Name a recurring decision once as a semantic token and reference it everywhere. Define once, change in one place."},{"kind":"li","depth":0,"marker":"5.","text":"**Minimize LOC.** Ship the shortest solution that stays maintainable.","raw":"5. **Minimize LOC.** Ship the shortest solution that stays maintainable."},{"kind":"li","depth":0,"marker":"6.","text":"**No `console.log`, `console.error`, or debug statements** in committed code. Logging belongs in services.","raw":"6. **No `console.log`, `console.error`, or debug statements** in committed code. Logging belongs in services."},{"kind":"li","depth":0,"marker":"7.","text":"**Never delete a feature because it is not built.** Unbuilt, stubbed, scaffolded and placeholder are states of work in progress — not evidence the thing was abandoned. This binds specs, seed data, types, primitives, enums, ESLint rules and codemods alike: an export nothing imports yet, a route with no page, a validation schema with no form. Removal needs an explicit instruction naming the feature; if you believe something is genuinely dead, say so and wait. Same rule for generated design OS artifacts — see `docs/MASTER_PROMPT_COMPLETE.md` › Critical Rules › Scope Preservation.","raw":"7. **Never delete a feature because it is not built.** Unbuilt, stubbed, scaffolded and placeholder are states of work in progress — not evidence the thing was abandoned. This binds specs, seed data, types, primitives, enums, ESLint rules and codemods alike: an export nothing imports yet, a route with no page, a validation schema with no form. Removal needs an explicit instruction naming the feature; if you believe something is genuinely dead, say so and wait. Same rule for generated design OS artifacts — see `docs/MASTER_PROMPT_COMPLETE.md` › Critical Rules › Scope Preservation."}]},{"heading":"Required patterns","level":2,"blocks":[{"kind":"th","cells":["Need","Use"],"text":"| Need               | Use                                                                                                                                                                                                                                                                   |"},{"kind":"tr","cells":["Styling","Token-first: named scale classes in `styles/globals.css` (`.pad`, `.pad-x`, `.pad-y`, `.gap`, `.gap-x`, `.gap-y`, `.smooth`) over tokens in `styles/tokens.css`. Style with Tailwind utilities on house tokens, responsive prefixes included; promote a pattern to a named class only when it repeats. Colors and animations are theme tokens."],"text":"| Styling            | Token-first: named scale classes in `styles/globals.css` (`.pad`, `.pad-x`, `.pad-y`, `.gap`, `.gap-x`, `.gap-y`, `.smooth`) over tokens in `styles/tokens.css`. Style with Tailwind utilities on house tokens, responsive prefixes included; promote a pattern to a named class only when it repeats. Colors and animations are theme tokens.              |"},{"kind":"tr","cells":["Component patterns","Reuse `components/ui/` (primitives) and `components/common/` (shared compositions) before writing JSX. A pattern used twice is promoted out of the page that birthed it."],"text":"| Component patterns | Reuse `components/ui/` (primitives) and `components/common/` (shared compositions) before writing JSX. A pattern used twice is promoted out of the page that birthed it.                                                                                              |"},{"kind":"tr","cells":["Domain types","Every shared domain type lives in `lib/types/\u003cdomain>.ts` and is re-exported by `lib/types/index.ts`. Components import types; they never declare shared ones."],"text":"| Domain types       | Every shared domain type lives in `lib/types/\u003cdomain>.ts` and is re-exported by `lib/types/index.ts`. Components import types; they never declare shared ones.                                                                                                        |"},{"kind":"tr","cells":["Page composition","A route `page.tsx` composes sections and holds page-level state — nothing else. Mock/seed data goes to `lib/data/`, JSX blocks to `components/`. No inline data array, no inline sub-component."],"text":"| Page composition   | A route `page.tsx` composes sections and holds page-level state — nothing else. Mock/seed data goes to `lib/data/`, JSX blocks to `components/`. No inline data array, no inline sub-component.                                                                       |"},{"kind":"tr","cells":["State management","TanStack Query for server state. `useState` / `useReducer` / URL params for local state. `useSyncExternalStore` + `localStorage` for persistence. A global store requires a stated reason."],"text":"| State management   | TanStack Query for server state. `useState` / `useReducer` / URL params for local state. `useSyncExternalStore` + `localStorage` for persistence. A global store requires a stated reason.                                                                            |"},{"kind":"tr","cells":["Validation","Zod schemas in `lib/validations/`. Types derive with `z.infer`. API responses are never loosely typed."],"text":"| Validation         | Zod schemas in `lib/validations/`. Types derive with `z.infer`. API responses are never loosely typed.                                                                                                                                                                |"},{"kind":"tr","cells":["IDs","`nanoid`. Never `uuid` or `Date.now()`."],"text":"| IDs                | `nanoid`. Never `uuid` or `Date.now()`.                                                                                                                                                                                                                               |"},{"kind":"tr","cells":["Async flows","Endpoints in `lib/api-routes.ts`, transport in `lib/api-client.ts`, wrapped in hooks in `lib/hooks/use-\u003cresource>.ts`. Components consume hooks — never call the client directly. A hook for an authenticated call wraps a Server Action from `lib/actions/` instead."],"text":"| Async flows        | Endpoints in `lib/api-routes.ts`, transport in `lib/api-client.ts`, wrapped in hooks in `lib/hooks/use-\u003cresource>.ts`. Components consume hooks — never call the client directly. A hook for an authenticated call wraps a Server Action from `lib/actions/` instead. |"}]},{"heading":"Folder Structure","level":2,"blocks":[{"kind":"th","cells":["Route","Immediate Subfolders","Purpose"],"text":"| Route                   | Immediate Subfolders                                                                    | Purpose                                                                                                                                                                  |"},{"kind":"tr","cells":["`/app`","`api/session` • `api/register` • `auth/login`","App Router routes. Pages compose — they do not define data or components. Nesting here is the URL, not a choice: a route handler or page must sit at the path it serves."],"text":"| `/app`                  | `api/session` • `api/register` • `auth/login`                                           | App Router routes. Pages compose — they do not define data or components. Nesting here is the URL, not a choice: a route handler or page must sit at the path it serves. |"},{"kind":"tr","cells":["`/components/ui`","_(flat)_","Generic, domain-free primitives. Reusable in any app."],"text":"| `/components/ui`        | _(flat)_                                                                                | Generic, domain-free primitives. Reusable in any app.                                                                                                                    |"},{"kind":"tr","cells":["`/components/common`","_(flat)_","Shared compositions over primitives."],"text":"| `/components/common`    | _(flat)_                                                                                | Shared compositions over primitives.                                                                                                                                     |"},{"kind":"tr","cells":["`/components/wrappers`","_(flat)_","Behavioural wrappers (motion, boundaries)."],"text":"| `/components/wrappers`  | _(flat)_                                                                                | Behavioural wrappers (motion, boundaries).                                                                                                                               |"},{"kind":"tr","cells":["`/components/providers`","_(flat)_","React context providers."],"text":"| `/components/providers` | _(flat)_                                                                                | React context providers.                                                                                                                                                 |"},{"kind":"tr","cells":["`/lib`","`actions` • `contract` • `data` • `enums` • `hooks` • `types` • `utils` • `validations`","Core logic layer. No JSX. Transport lives in `api-client.ts` + `api-routes.ts`."],"text":"| `/lib`                  | `actions` • `contract` • `data` • `enums` • `hooks` • `types` • `utils` • `validations` | Core logic layer. No JSX. Transport lives in `api-client.ts` + `api-routes.ts`.                                                                                          |"},{"kind":"tr","cells":["`/design-os`","`generated`","Generated design OS output. The seed prompt itself is `docs/MASTER_PROMPT_COMPLETE.md`. Not application code."],"text":"| `/design-os`            | `generated`                                                                             | Generated design OS output. The seed prompt itself is `docs/MASTER_PROMPT_COMPLETE.md`. Not application code.                                                            |"},{"kind":"tr","cells":["`/public`","`fonts`","Static assets."],"text":"| `/public`               | `fonts`                                                                                 | Static assets.                                                                                                                                                           |"},{"kind":"tr","cells":["`/styles`","_(flat)_","Global styles and token exports."],"text":"| `/styles`               | _(flat)_                                                                                | Global styles and token exports.                                                                                                                                         |"},{"kind":"tr","cells":["`/tools/eslint`","`rules`","Custom ESLint rules that enforce the conventions in this file. Not app code."],"text":"| `/tools/eslint`         | `rules`                                                                                 | Custom ESLint rules that enforce the conventions in this file. Not app code.                                                                                             |"},{"kind":"tr","cells":["`/tools/codemods`","_(flat)_","ts-morph codemods that rewrite violations the rules report. Not app code."],"text":"| `/tools/codemods`       | _(flat)_                                                                                | ts-morph codemods that rewrite violations the rules report. Not app code.                                                                                                |"},{"kind":"tr","cells":["`/tools/contract`","_(flat)_","Generator that turns the backend's OpenAPI document into `lib/contract/`."],"text":"| `/tools/contract`       | _(flat)_                                                                                | Generator that turns the backend's OpenAPI document into `lib/contract/`.                                                                                                |"},{"kind":"p","text":"Add `lib/data/` (seed data) and `lib/constants.ts` on first use — the rules above assume those homes."},{"kind":"p","text":"Conventions in this file that can be checked mechanically belong in `tools/eslint/rules/` as a rule with a colocated `.test.ts`, registered by the `starter` plugin in `eslint.config.ts`. Where flat config already expresses the constraint (`no-restricted-imports` and friends), use config — a custom rule must earn itself by needing scope or path analysis config cannot reach."},{"kind":"p","text":"A rule that reports a violation ESLint cannot autofix — because the fix spans files — gets a matching codemod in `tools/codemods/`, also with a colocated `.test.ts` driven by an in-memory ts-morph project. Codemods are dry-run by default and only write under `--write`. When a transform would have to guess intent, it skips the call and reports the reason instead."}]},{"heading":"The contract layer","level":2,"blocks":[{"kind":"p","text":"`lib/contract/` is **generated — never edit it**. The backend's class-validator DTOs are the origin; `pnpm openapi` in `nest-setup` emits `openapi.json`, and `pnpm contract` here turns that into Zod schemas, `z.infer` types, and typed route builders. Change a field on a DTO, regenerate, and `pnpm type-check` fails here at every consumer — that break is the point of the layer."},{"kind":"p","text":"Regeneration is not left to memory: `pnpm contract:check` regenerates in place, diffs against `lib/contract/`, and fails the pre-push hook when the two disagree."},{"kind":"p","text":"Every route builder returns an `Endpoint\u003cTResponse>` — a branded string carrying the response type the backend documents for that operation. `query.get(routes.usersFindOne(id))` therefore resolves to `ApiResponse\u003cUserResponseDto>` with no type argument at the call site. A response type reaches the contract only when its controller method is annotated with `@ApiEnvelope(Dto)` in `nest-setup`; without that annotation the endpoint degrades to `Endpoint\u003cunknown>`."},{"kind":"p","text":"Import request shapes and endpoints from `@/lib/contract`, not by hand. `lib/api-routes.ts` remains for endpoints the backend does not publish. Hand-written Zod in `lib/validations/` composes over the generated schemas (`.extend`, `.pick`) rather than restating them."}]},{"heading":"File rules","level":2,"blocks":[{"kind":"li","depth":0,"marker":"-","text":"**One component per file.** Kebab-case filename matching the export (`motion-wrapper.tsx` → `MotionWrapper`).","raw":"- **One component per file.** Kebab-case filename matching the export (`motion-wrapper.tsx` → `MotionWrapper`)."},{"kind":"li","depth":0,"marker":"-","text":"**Absolute imports via `@/`.** Never deep-relative (`../../../lib/...`).","raw":"- **Absolute imports via `@/`.** Never deep-relative (`../../../lib/...`)."},{"kind":"li","depth":0,"marker":"-","text":"**Any file over ~150 lines gets split**, `page.tsx` included. Data moves to `lib/data/`, JSX to `components/`.","raw":"- **Any file over ~150 lines gets split**, `page.tsx` included. Data moves to `lib/data/`, JSX to `components/`."}]},{"heading":"Before you commit or push","level":2,"blocks":[{"kind":"p","text":"Formatting and linting are automated. They are not chores you run by hand."},{"kind":"li","depth":0,"marker":"-","text":"**Commit** — Husky's `pre-commit` hook runs `pnpm lint-staged` and nothing else: `eslint --fix` then `prettier --write`, over staged files only. It is fast by design.","raw":"- **Commit** — Husky's `pre-commit` hook runs `pnpm lint-staged` and nothing else: `eslint --fix` then `prettier --write`, over staged files only. It is fast by design."},{"kind":"li","depth":0,"marker":"-","text":"**Push** — Husky's `pre-push` hook runs `pnpm type-check`, then `pnpm lint`, then `pnpm contract:check`, and blocks on failure. This is the real gate.","raw":"- **Push** — Husky's `pre-push` hook runs `pnpm type-check`, then `pnpm lint`, then `pnpm contract:check`, and blocks on failure. This is the real gate."},{"kind":"p","text":"`pnpm format` and `pnpm lint` stay available for a manual full-repo sweep, but no workflow requires you to run them."},{"kind":"p","text":"The rules above are not restated here. They bind every edit, not the gate."}]}]},{"group":"Instructions","title":"nest-setup CLAUDE.md","path":"C:/Users/emman/Downloads/Personal/js/setup/nest-setup/.claude/CLAUDE.md","meta":{},"sections":[{"heading":"Project Instructions","level":1,"blocks":[{"kind":"p","text":"This is a reusable **NestJS + Prisma backend starter** with a strict, layered, type-safe architecture designed for scale and maintainability."}]},{"heading":"Non-negotiable rules","level":2,"blocks":[{"kind":"li","depth":0,"marker":"1.","text":"**Every file has exactly one job.** `*.controller.ts` = HTTP only · `*.service.ts` = business logic only · `*.repo.ts` = data access only · `*.module.ts` = DI wiring only · `*.dto.ts` = validation only. A file over ~150 lines of logic is doing too much — split it.","raw":"1. **Every file has exactly one job.** `*.controller.ts` = HTTP only · `*.service.ts` = business logic only · `*.repo.ts` = data access only · `*.module.ts` = DI wiring only · `*.dto.ts` = validation only. A file over ~150 lines of logic is doing too much — split it."},{"kind":"li","depth":0,"marker":"2.","text":"**Data access lives only in `common/repos/[domain].repo.ts`.** Nothing else touches Prisma. Ever.","raw":"2. **Data access lives only in `common/repos/[domain].repo.ts`.** Nothing else touches Prisma. Ever."},{"kind":"li","depth":0,"marker":"3.","text":"**Layers flow one way:** Controller → Service → Repository → Prisma. A controller may NOT call a repo. A service may NOT touch `req`/`res`. A repo may NOT hold business logic.","raw":"3. **Layers flow one way:** Controller → Service → Repository → Prisma. A controller may NOT call a repo. A service may NOT touch `req`/`res`. A repo may NOT hold business logic."},{"kind":"li","depth":0,"marker":"4.","text":"**Services never return raw Prisma models.** Always return domain/response objects. Transform at the boundary.","raw":"4. **Services never return raw Prisma models.** Always return domain/response objects. Transform at the boundary."},{"kind":"li","depth":0,"marker":"5.","text":"**Single source of truth.** Models in `schema.prisma`, validation in DTOs, errors in `common/errors/`, auth in `modules/core/auth/`, enums in `common/enums/`. No duplication anywhere.","raw":"5. **Single source of truth.** Models in `schema.prisma`, validation in DTOs, errors in `common/errors/`, auth in `modules/core/auth/`, enums in `common/enums/`. No duplication anywhere."},{"kind":"li","depth":0,"marker":"6.","text":"**Use the framework.** Prisma (not raw SQL), class-validator (not custom validators), Nest guards (not custom middleware), global interceptor (not ad-hoc wrappers). Don't hand-roll what Nest provides.","raw":"6. **Use the framework.** Prisma (not raw SQL), class-validator (not custom validators), Nest guards (not custom middleware), global interceptor (not ad-hoc wrappers). Don't hand-roll what Nest provides."},{"kind":"li","depth":0,"marker":"7.","text":"**No hardcoding.** Config, secrets, base URLs, magic numbers, role names, repeated literals — all live in env (`@nestjs/config`), `common/enums/`, or a constants file. Never inline.","raw":"7. **No hardcoding.** Config, secrets, base URLs, magic numbers, role names, repeated literals — all live in env (`@nestjs/config`), `common/enums/`, or a constants file. Never inline."},{"kind":"li","depth":0,"marker":"8.","text":"**No dead code, stubs, or placeholders.** Delete unused code.","raw":"8. **No dead code, stubs, or placeholders.** Delete unused code."},{"kind":"li","depth":0,"marker":"9.","text":"**No `console.log` or debug statements** in committed code. Use the Nest logger.","raw":"9. **No `console.log` or debug statements** in committed code. Use the Nest logger."},{"kind":"p","text":"**Absolute imports via `@common/*` and `@lib/*`.** Never deep-relative (`../../../common/...`)."},{"kind":"p","text":"**This is the only architecture.** Follow it precisely. If you're unsure where something goes, the design is broken — re-read this instead of inventing new locations."},{"kind":"p","text":"---"}]},{"heading":"Core Principle: Derive, Never Reconstruct","level":2,"blocks":[{"kind":"p","text":"If a library or framework generates a type, schema, validation result, or query shape, use that derived output directly. Examples: Prisma `GetPayload\u003c>`, Zod `infer`, class-validator DTO output, NestJS guards, global interceptor results."},{"kind":"p","text":"Never replace a derived artifact with `any`, `Record\u003c>`, `as` assertions, or hand-written parallel types. If you need a smaller shape, derive it via framework helpers or standard TypeScript utilities (`Pick`, `Omit`), not ad hoc object literals."},{"kind":"p","text":"**When you encounter a new framework tool:** First check whether it produces a derived type, schema, result shape, or validation outcome. If it does, use that output directly and avoid manual reconstruction."},{"kind":"th","cells":["Derived artifact","Source → Use","✅ Do","❌ Don't"],"text":"| Derived artifact        | Source → Use                                               | ✅ Do                                                            | ❌ Don't                                   |"},{"kind":"tr","cells":["**Prisma query result**","`.findUnique({ include: { plan: true } })` → typed payload","Use `Prisma.SubscriptionGetPayload\u003c{ include: { plan: true } }>`","Cast to `any` or `Record\u003c>`"],"text":"| **Prisma query result** | `.findUnique({ include: { plan: true } })` → typed payload | Use `Prisma.SubscriptionGetPayload\u003c{ include: { plan: true } }>` | Cast to `any` or `Record\u003c>`                |"},{"kind":"tr","cells":["**Zod schema**","`schema` → validated input + inferred type","Use `z.infer\u003ctypeof schema>`","Duplicate the type by hand"],"text":"| **Zod schema**          | `schema` → validated input + inferred type                 | Use `z.infer\u003ctypeof schema>`                                     | Duplicate the type by hand                 |"},{"kind":"tr","cells":["**class-validator DTO**","Decorated DTO → validated request object","Accept the validated DTO in the service","Re-validate the same fields in the service"],"text":"| **class-validator DTO** | Decorated DTO → validated request object                   | Accept the validated DTO in the service                          | Re-validate the same fields in the service |"},{"kind":"tr","cells":["**NestJS guards**","`@UseGuards(JwtAuthGuard)` → authenticated request","Call the service after the guard passes","Hand-roll auth checks in the service"],"text":"| **NestJS guards**       | `@UseGuards(JwtAuthGuard)` → authenticated request         | Call the service after the guard passes                          | Hand-roll auth checks in the service       |"},{"kind":"tr","cells":["**Global interceptor**","`return data` from controller → wrapped response","Return the domain object directly","Build `{ status, data, message }` manually"],"text":"| **Global interceptor**  | `return data` from controller → wrapped response           | Return the domain object directly                                | Build `{ status, data, message }` manually |"}]},{"heading":"Required patterns","level":2,"blocks":[{"kind":"th","cells":["Layer","Responsibility","Rules"],"text":"| Layer          | Responsibility                                                                                                                         | Rules                                                                                                                                                        |"},{"kind":"tr","cells":["**Controller**","Extract route params + body, call service, return result. Add `@UseGuards(JwtAuthGuard)` + `@Roles()` for protected routes.","No business logic. No Prisma. No direct repo calls."],"text":"| **Controller** | Extract route params + body, call service, return result. Add `@UseGuards(JwtAuthGuard)` + `@Roles()` for protected routes.            | No business logic. No Prisma. No direct repo calls.                                                                                                          |"},{"kind":"tr","cells":["**Service**","Accept DTOs, enforce business rules, throw `HttpException`s, call repo methods, return domain objects.","No raw Prisma models in responses. No `req`/`res` objects. Never throw `RepoError` directly. Business logic, filtering, aggregation, composition — all here."],"text":"| **Service**    | Accept DTOs, enforce business rules, throw `HttpException`s, call repo methods, return domain objects.                                 | No raw Prisma models in responses. No `req`/`res` objects. Never throw `RepoError` directly. Business logic, filtering, aggregation, composition — all here. |"},{"kind":"tr","cells":["**Repository**","**ONLY** wrap the 10 Prisma-native methods in `try/catch`, rethrow as `RepoError`. Use `Prisma.[Model]GetPayload\u003c>` for typed results.","Thin Prisma wrapper only. See \"Repository Methods: Ironclad Rule\" below. No custom domain methods."],"text":"| **Repository** | **ONLY** wrap the 10 Prisma-native methods in `try/catch`, rethrow as `RepoError`. Use `Prisma.[Model]GetPayload\u003c>` for typed results. | Thin Prisma wrapper only. See \"Repository Methods: Ironclad Rule\" below. No custom domain methods.                                                           |"},{"kind":"tr","cells":["**DTO**","Use class-validator decorators for input validation at the boundary. `UpdateDto extends PartialType(CreateDto)`.","Type source for incoming data. Never used as response shape."],"text":"| **DTO**        | Use class-validator decorators for input validation at the boundary. `UpdateDto extends PartialType(CreateDto)`.                       | Type source for incoming data. Never used as response shape.                                                                                                 |"},{"kind":"tr","cells":["**Module**","Import dependencies, declare controller + service, export service if shared.","DI wiring only."],"text":"| **Module**     | Import dependencies, declare controller + service, export service if shared.                                                           | DI wiring only.                                                                                                                                              |"}]},{"heading":"Repository Methods: Ironclad Rule","level":2,"blocks":[{"kind":"p","text":"**Repositories are ONLY thin wrappers around Prisma's 10 native methods.** No custom domain methods."}]},{"heading":"Folder Structure","level":2,"blocks":[{"kind":"th","cells":["Route","Purpose"],"text":"| Route                     | Purpose                                                                                                                              |"},{"kind":"tr","cells":["`/src/common/`","Shared infrastructure: repos, filters, guards, errors, enums, decorators, middleware."],"text":"| `/src/common/`            | Shared infrastructure: repos, filters, guards, errors, enums, decorators, middleware.                                                |"},{"kind":"tr","cells":["`/src/common/repos/`","Data access layer. One `[domain].repo.ts` per entity. Prisma only. **Repos = thin wrappers around Prisma's 10 native methods only.**"],"text":"| `/src/common/repos/`      | Data access layer. One `[domain].repo.ts` per entity. Prisma only. **Repos = thin wrappers around Prisma's 10 native methods only.** |"},{"kind":"tr","cells":["`/src/common/errors/`","Error definitions (`RepoError`). The filter that shapes them lives in `common/filters/`."],"text":"| `/src/common/errors/`     | Error definitions (`RepoError`). The filter that shapes them lives in `common/filters/`.                                             |"},{"kind":"tr","cells":["`/src/common/enums/`","Constants and enums. Single source of truth."],"text":"| `/src/common/enums/`      | Constants and enums. Single source of truth.                                                                                         |"},{"kind":"tr","cells":["`/src/common/decorators/`","Custom decorators (auth, roles, etc.)."],"text":"| `/src/common/decorators/` | Custom decorators (auth, roles, etc.).                                                                                               |"},{"kind":"tr","cells":["`/src/lib/`","Pure utility functions and helpers. No NestJS dependencies. `period.ts` owns day/month/year boundaries."],"text":"| `/src/lib/`               | Pure utility functions and helpers. No NestJS dependencies. `period.ts` owns day/month/year boundaries.                              |"},{"kind":"tr","cells":["`/src/modules/core/`","Domain-specific modules. One folder per domain with `dto/`, `*.service.ts`, `*.controller.ts`, `*.module.ts`."],"text":"| `/src/modules/core/`      | Domain-specific modules. One folder per domain with `dto/`, `*.service.ts`, `*.controller.ts`, `*.module.ts`.                        |"},{"kind":"tr","cells":["`/src/modules/core/auth/`","Authentication logic. Already implemented. Extend, don't reinvent."],"text":"| `/src/modules/core/auth/` | Authentication logic. Already implemented. Extend, don't reinvent.                                                                   |"}]},{"heading":"Before you commit or push","level":2,"blocks":[{"kind":"p","text":"Formatting and linting are automated. They are not chores you run by hand."},{"kind":"li","depth":0,"marker":"-","text":"**Commit** — Husky's `pre-commit` hook runs `pnpm lint-staged` and nothing else: `eslint --fix` then `prettier --write`, over staged files only. It is fast by design.","raw":"- **Commit** — Husky's `pre-commit` hook runs `pnpm lint-staged` and nothing else: `eslint --fix` then `prettier --write`, over staged files only. It is fast by design."},{"kind":"li","depth":0,"marker":"-","text":"**Push** — Husky's `pre-push` hook runs `pnpm type-check`, then `pnpm lint`, and blocks on failure. This is the real gate.","raw":"- **Push** — Husky's `pre-push` hook runs `pnpm type-check`, then `pnpm lint`, and blocks on failure. This is the real gate."},{"kind":"li","depth":0,"marker":"-","text":"**OpenAPI** — if any DTO, route, or `@ApiProperty` changed, run `pnpm openapi` and commit `openapi.json`.","raw":"- **OpenAPI** — if any DTO, route, or `@ApiProperty` changed, run `pnpm openapi` and commit `openapi.json`."},{"kind":"p","text":"`pnpm format` and `pnpm lint` stay available for a manual full-repo sweep, but no workflow requires you to run them."}]},{"heading":"Pre-merge checklist","level":2,"blocks":[{"kind":"li","depth":0,"marker":"1.","text":"No `console.log`, no dead code or stubs.","raw":"1. No `console.log`, no dead code or stubs."},{"kind":"li","depth":0,"marker":"2.","text":"No inline type/lint rule suppressions (`// @ts-ignore`, `// eslint-disable`, `as any`, etc.).","raw":"2. No inline type/lint rule suppressions (`// @ts-ignore`, `// eslint-disable`, `as any`, etc.)."},{"kind":"li","depth":0,"marker":"3.","text":"No hardcoded config, secrets, or magic values (all in env, enums, or constants).","raw":"3. No hardcoded config, secrets, or magic values (all in env, enums, or constants)."},{"kind":"li","depth":0,"marker":"4.","text":"Reused existing repos, guards, filters, and the global interceptor. Nothing reinvented.","raw":"4. Reused existing repos, guards, filters, and the global interceptor. Nothing reinvented."},{"kind":"li","depth":0,"marker":"5.","text":"Followed the layer contracts. Repos stayed thin. Matched the `users` module pattern exactly.","raw":"5. Followed the layer contracts. Repos stayed thin. Matched the `users` module pattern exactly."},{"kind":"p","text":"**Do not merge if any check fails.**"}]}]},{"group":"Skills","title":"elegant-ui (next-setup)","path":"C:/Users/emman/Downloads/Personal/js/setup/next-setup/.claude/skills/elegant-ui/SKILL.md","meta":{"name":"elegant-ui","description":">-"},"sections":[{"heading":"Elegant UI","level":1,"blocks":[{"kind":"p","text":"Every piece of UI in this starter is written in **its own design tokens and primitives**, never generic shadcn defaults. This skill is register-neutral: it governs vocabulary, structure and quality floors. How dense, how loud and how animated the result is belongs to the brief."}]},{"heading":"Two modes","level":2,"blocks":[{"kind":"th","cells":["Mode","Trigger","Output"],"text":"| Mode        | Trigger                                                                                              | Output                                                                   |"},{"kind":"tr","cells":["**Create**","Component/screen does **not** exist yet (\"build a…\", \"add a…\", \"make a…\")","A component written directly into `components/` in the house vocabulary."],"text":"| **Create**  | Component/screen does **not** exist yet (\"build a…\", \"add a…\", \"make a…\")                            | A component written directly into `components/` in the house vocabulary. |"},{"kind":"tr","cells":["**Upgrade**","An existing component named + the word **\"upgrade\"** (or \"elevate\", \"make it premium\", \"package it\")","The component rebuilt against every rule below."],"text":"| **Upgrade** | An existing component named + the word **\"upgrade\"** (or \"elevate\", \"make it premium\", \"package it\") | The component rebuilt against every rule below.                          |"},{"kind":"p","text":"If the mode is ambiguous, default to **Create** and say so."}]},{"heading":"Prime directive: translate, don't transplant","level":2,"blocks":[{"kind":"p","text":"Learn _structure, layout, composition, and interaction_ from any exemplar (a dribbble shot, a 21st.dev prompt, a pasted component). But **every color, font, radius, shadow, spacing, and easing value must be a house token** from the table below. A dark hardcoded `bg-black text-neutral-50` reference becomes `bg-sidebar text-sidebar-text-active`. `bg-card` becomes `bg-background-muted`. Never emit a raw hex, a stock Tailwind palette color (`neutral-800`, `slate-500`), or a shadcn default token (`bg-card`, `text-muted-foreground`, `text-foreground`) — those tokens do not exist here. A value the brief needs that has no token gets a token in `styles/tokens.css` first."}]},{"heading":"House tokens — the only vocabulary","level":2,"blocks":[{"kind":"p","text":"Tailwind v4, tokens defined in `styles/tokens.css` + `@theme` in `styles/globals.css`. Dark mode = `.dark` class variant (`@custom-variant dark`)."},{"kind":"p","text":"**Color** (prefix `bg-` / `text-` / `border-`):\n`background` · `background-alt` · `background-muted` — surfaces\n`text` · `text-secondary` · `text-muted` · `text-inverse` — foreground ramp\n`primary` · `primary-dark` · `primary-light` and `accent` · `accent-dark` · `accent-light` — brand / interactive color (CTAs, active, emphasis). The concrete hues are defined once in styles/tokens.css.\n`highlight` · `highlight-dark` · `highlight-light` — the secondary accent for \"pop\" moments.\n`border` · `border-light` · `border-dark` — 1px dividers\n`success` · `error` · `warning` · `info` (+ each `-light`) — status only (note: it is **`error`**, not `danger`)\n`sidebar` · `sidebar-border` · `sidebar-hover` · `sidebar-active` · `sidebar-text` · `sidebar-text-active` — the dark ramp\n`metric-pipeline` · `metric-success` · `metric-activity` · `metric-warning` — metric/stat accents\n`overlay` — modal scrims"},{"kind":"p","text":"**There is no numeric ramp here.** Color steps by named suffix (`accent` / `accent-dark` / `accent-light`), never by `-50…-900`."},{"kind":"p","text":"**Type:** families `font-display` · `font-body` · `font-mono` — the concrete typefaces are wired once in public/fonts/font.ts and exposed via the @theme in styles/globals.css; never restate the family names here. Scale `text-h1` … `text-h6`, `text-lg` · `text-base` · `text-sm` · `text-xs` · `text-label` · `text-caption` · `text-micro`. Weights `font-light` (300) … `font-bold` (700)."},{"kind":"p","text":"**Named scale classes** in `styles/globals.css`: `.pad` / `.pad-x` / `.pad-y`, `.gap` / `.gap-x` / `.gap-y`, `.large-pad`, `.md-pad`, `.smooth`, `.micro-label` (mono uppercase eyebrow, no colour — append the tone), `.measure` (54ch prose), `.safe-t` / `.safe-b`, `.collapse-grid` (`0fr`↔`1fr` disclosure, flipped by `data-open`), `.dot-grid`, `.focal-glow`, `.nav-floating`, `.context-rail`, and the `.stat-card` / `.metric-*` family. Style with Tailwind utilities on house tokens in the JSX, responsive prefixes included; reach for a named class when a pattern repeats, not by default. A value with no token gets one in `styles/tokens.css` first and is used as `text-(--token)` or through a named class."},{"kind":"p","text":"**Radius** `rounded-none xs sm md lg xl full`. **Shadow** `shadow-sm md lg xl 2xl`. **Motion** easing `ease-smooth` (default), `ease-out`, `ease-in`, `ease-in-out`, `ease-linear`. **Z-index** via tokens as arbitrary values (`z-(--z-indices-modal)`, `z-(--z-indices-popover)`, …) — there is no `z-modal` utility."}]},{"heading":"Structure rules","level":2,"blocks":[{"kind":"li","depth":0,"marker":"1.","text":"**Decompose aggressively.** One job per component, **one component per file** — `starter/one-component-per-file` enforces both the count and the kebab-case filename match, so a screen is a shell that _imports_ many small named pieces, each in its own file. **Section banner comments are unavailable** — `starter/no-comments` errors on every comment in the tree; the file boundary is the grouping.","raw":"1. **Decompose aggressively.** One job per component, **one component per file** — `starter/one-component-per-file` enforces both the count and the kebab-case filename match, so a screen is a shell that _imports_ many small named pieces, each in its own file. **Section banner comments are unavailable** — `starter/no-comments` errors on every comment in the tree; the file boundary is the grouping."},{"kind":"li","depth":0,"marker":"2.","text":"**Data-driven rendering.** Content lives in typed data (`lib/data/` for seed and copy); JSX maps over it. Types live in `lib/types/`. Recurse when the UI nests.","raw":"2. **Data-driven rendering.** Content lives in typed data (`lib/data/` for seed and copy); JSX maps over it. Types live in `lib/types/`. Recurse when the UI nests."},{"kind":"li","depth":0,"marker":"3.","text":"**Build primitives to the house standard**, not shadcn's `data-slot` style: `forwardRef` + explicit `HTMLAttributes\u003c…>` props + `displayName`; variants as typed `Record\u003cVariant, string>` maps composed with `clsx` (no `cva` — it is not installed). The starter ships only `components/ui/button.tsx`; build Card / Modal / Badge / etc. to this standard when needed. House gotcha: **`Button` has no `asChild`/Slot** — for a link, wrap `\u003cLink>` around `\u003cButton>` — and its `size` axis is fixed heights (`sm` `h-8` · `md` `h-9` · `lg` `h-10` · `xl` `h-11`) across three tones (`accent` · `quiet` · `ghost`).","raw":"3. **Build primitives to the house standard**, not shadcn's `data-slot` style: `forwardRef` + explicit `HTMLAttributes\u003c…>` props + `displayName`; variants as typed `Record\u003cVariant, string>` maps composed with `clsx` (no `cva` — it is not installed). The starter ships only `components/ui/button.tsx`; build Card / Modal / Badge / etc. to this standard when needed. House gotcha: **`Button` has no `asChild`/Slot** — for a link, wrap `\u003cLink>` around `\u003cButton>` — and its `size` axis is fixed heights (`sm` `h-8` · `md` `h-9` · `lg` `h-10` · `xl` `h-11`) across three tones (`accent` · `quiet` · `ghost`)."},{"kind":"li","depth":0,"marker":"4.","text":"**Controlled + uncontrolled duality** where a parent may or may not own state: `const current = value ?? internal`.","raw":"4. **Controlled + uncontrolled duality** where a parent may or may not own state: `const current = value ?? internal`."},{"kind":"li","depth":0,"marker":"5.","text":"**Motion through `motion`** (already installed) and the easing tokens; `prefers-reduced-motion` always gets a still equivalent.","raw":"5. **Motion through `motion`** (already installed) and the easing tokens; `prefers-reduced-motion` always gets a still equivalent."}]},{"heading":"Quality floor","level":2,"blocks":[{"kind":"li","depth":0,"marker":"-","text":"One radius language per component.","raw":"- One radius language per component."},{"kind":"li","depth":0,"marker":"-","text":"Hierarchy comes from the text ramp and surface steps before saturated fills.","raw":"- Hierarchy comes from the text ramp and surface steps before saturated fills."},{"kind":"li","depth":0,"marker":"-","text":"Every interactive element has hover, focus-visible and disabled states; every control is keyboard reachable and labelled.","raw":"- Every interactive element has hover, focus-visible and disabled states; every control is keyboard reachable and labelled."},{"kind":"li","depth":0,"marker":"-","text":"Animated collapse via `.collapse-grid`, not max-height hacks.","raw":"- Animated collapse via `.collapse-grid`, not max-height hacks."}]}]},{"group":"Memories","title":"js / web / real / estate-frontend","path":"C:/Users/emman/.claude/projects/C--Users-emman-Downloads-Personal-js-web-real-estate-frontend/memory","sections":[{"heading":"design-os-is-append-only","level":2,"memory":true,"description":"Never resolve a spec-vs-code gap by deleting or rewording design-os content; add a divergence record instead","type":"feedback","file":"design-os-is-append-only.md","blocks":[{"kind":"p","text":"`design-os/CORE-PHASES/` is append-only. When the code diverges from a blueprint, never edit or trim the phase document to match — add an entry to `design-os/INDEX/RATIFIED_DIVERGENCES.md` and, if the decision is expensive to reverse, an ADR in `docs/adr/`."},{"kind":"p","text":"**Why:** the user stated it as an absolute (\"under no circumstance\"), framing spec-trimming as lazy work. A blueprint quietly rewritten to match whatever shipped stops being a specification and becomes a changelog — the requirement it encoded is erased rather than scheduled."},{"kind":"p","text":"**How to apply:** classify every gap as *ratified* (code is right, spec fell behind) or *deferred* (spec is right, blocked on a stated precondition), and record which. `docs/DESIGN_OS_CONFORMANCE.html` is a dated audit — append a remediation section rather than editing the original findings."}]},{"heading":"domain-is-keyhol-me","level":2,"memory":true,"description":"The production domain is keyhol.me (no d) on purpose; keyhold.me is owned by a stranger","type":"project","file":"domain-is-keyhol-me.md","blocks":[{"kind":"p","text":"The production domain is `keyhol.me` — one letter short of the product name. It was registered on 2026-09-09 via the GitHub Student Pack Namecheap offer, and its nameservers moved to Cloudflare (`mona`/`tosana.ns.cloudflare.com`) by 2026-09-11. The product name stays \"Keyhold\" in the UI."},{"kind":"p","text":"**Why:** the user mistyped the registration. `keyhold.me` is registered to an unrelated third party on their own Cloudflare account, so the intended name was never available, and Namecheap's student offer is one domain per student."},{"kind":"p","text":"**How to apply:** never \"correct\" `keyhol.me` to `keyhold.me` in docs, env vars, DNS, or code — that would point at a stranger's site. Before onboarding any domain anywhere, confirm the spelling against Namecheap's Domain List. Related: [[vouchmark-is-employer-domain]]."}]},{"heading":"install-proposals-need-alternatives","level":2,"memory":true,"description":"Every install proposal must compare alternatives with strengths/weaknesses and name the best, never pitch a single package","type":"feedback","file":"install-proposals-need-alternatives.md","blocks":[{"kind":"p","text":"When proposing any dependency install, present the realistic alternatives (including the no-install / native option), state each one's strengths and weaknesses, then say which is best and why. Never pitch a single package on its own. Still wait for explicit approval before installing."},{"kind":"p","text":"**Why:** the user corrected a proposal that named only `@base-ui/react` for the primitives upgrade (2026-09-21); they want to choose from a comparison, not rubber-stamp one pick."},{"kind":"p","text":"**How to apply:** use a short comparison table (option · strengths · weaknesses · fit here), then a one-line recommendation, then stop for a yes. Applies on top of the global \"never install without approval\" rule."}]},{"heading":"next-config-no-path-alias","level":2,"memory":true,"description":"next.config.ts and anything it imports must use relative imports, never the @/ alias","type":"project","file":"next-config-no-path-alias.md","blocks":[{"kind":"p","text":"In the frontend, `next.config.ts` and every module reachable from it must import with relative paths (`./lib/constants`), not the `@/` alias. Next 16 compiles the config to `next.config.compiled.js` at the repo root and rewrites `@/lib/constants` to `./lib/constants`, then resolves it relative to the *importing* file — so an `@/` import inside `lib/config/security-headers.ts` resolves to `lib/config/lib/constants` and dies with `Failed to load next.config.ts` / `MODULE_NOT_FOUND`."},{"kind":"p","text":"**Why:** this is the one place the project's \"absolute imports via `@/`, never relative\" rule cannot hold, and the failure is a dead dev server rather than a type error, so nothing catches it before runtime."},{"kind":"p","text":"**How to apply:** keep `lib/` modules alias-only and free of config-specific imports; when the config needs a value from `lib/`, have `next.config.ts` import it relatively and pass it in as a parameter (as it does with `securityHeaders(config.api.base)`)."}]},{"heading":"vouchmark-is-employer-domain","level":2,"memory":true,"description":"vouchmark.com is the user's employer's domain and Microsoft 365 tenant — never use it, its DNS, or its Azure directory for this personal project.","type":"project","file":"vouchmark-is-employer-domain.md","blocks":[{"kind":"p","text":"`vouchmark.com` belongs to the company where the user is an **intern** — access is temporary and will be deprovisioned when the placement ends. `support@vouchmark.com` is a shared company address, and the domain has an employer-owned Microsoft 365 / Entra ID tenant provisioned through GoDaddy (`NETORGFT15900436.onmicrosoft.com`). The real-estate marketplace under `Downloads/Personal/` is the user's own project and is unrelated to that company."},{"kind":"p","text":"**Why:** Registering third-party services under a company address, adding DNS records to company DNS, or creating cloud resources inside the employer's Entra directory puts personal work under someone else's control — their admins can see and delete it, and it disappears when the work account is deprovisioned."},{"kind":"p","text":"**How to apply:** Never propose any `@vouchmark.com` address for signups, sending identity, or account recovery, and never suggest changing vouchmark.com DNS. In the Azure portal the work identity is the *default* directory, so always check the directory switcher before provisioning — personal resources belong in a separate directory under a personal or student identity. When a service demands a non-freemail address, the project needs its own domain, which it requires anyway for a verified sending domain."}]}]},{"group":"Memories","title":"js / setup / next-setup","path":"C:/Users/emman/.claude/projects/c--Users-emman-Downloads-Personal-js-setup-next-setup/memory","sections":[{"heading":"cinematic-web-skill","level":2,"memory":true,"description":"Why elegant-ui was stripped to a neutral core and cinematic-web added; what is still pending approval.","type":"project","file":"cinematic-web-skill.md","blocks":[{"kind":"p","text":"On 2026-09-25 the user was unhappy that Claude produced basic-looking websites. elegant-ui was stripped to register-neutral house mechanics, and a `cinematic-web` register skill was added for motion-led marketing pages. Its references are the Pegasus and NebulaX sites from a Nate Herk TikTok; neither has a live site."},{"kind":"p","text":"**Why:** elegant-ui's dense dashboard rules (no scroll reveals, no glow) were suppressing premium landing-page output."},{"kind":"p","text":"**How to apply:** still pending explicit approval are the technique library (three / @react-three/fiber / drei for route C; ffmpeg and a generation service for route B) The lab is `../cinematic-lab`: a clone of the starter with no git remote, where the first build (Tributary, route A, placeholder product) lives. The skill's canonical copy stays in next-setup; the lab holds a synced copy. Cinematic routes must opt out of `starter/application-register-density` via a files block in eslint.config.ts. Related: [[convention-enforcement-curriculum]]."}]},{"heading":"convention-enforcement-curriculum","level":2,"memory":true,"description":"The four-milestone deep-work sequence agreed 2026-08-04 for next-setup / nest-setup, and which milestones are done.","type":"project","file":"convention-enforcement-curriculum.md","blocks":[{"kind":"p","text":"Emmanuel wants to push past everyday app work through four chained milestones across `next-setup` and `nest-setup`, in this order because each supplies tooling for the next:"},{"kind":"li","depth":0,"marker":"1.","text":"**Custom ESLint rules + ts-morph codemods** — turn the CLAUDE.md conventions into machine-checked rules. *Done 2026-08-05*: `tools/eslint/` plugin with `starter/api-access-boundary` (11 RuleTester cases) plus `tools/codemods/` extract-transport-to-hook (5 in-memory ts-morph cases), `pnpm codemod:extract-hooks` dry-run-by-default CLI, `pnpm test` in the commit gate. The codemod deliberately handles GET only and skips-with-reason anything needing intent (mutations, non-primitive locals).","raw":"1. **Custom ESLint rules + ts-morph codemods** — turn the CLAUDE.md conventions into machine-checked rules. *Done 2026-08-05*: `tools/eslint/` plugin with `starter/api-access-boundary` (11 RuleTester cases) plus `tools/codemods/` extract-transport-to-hook (5 in-memory ts-morph cases), `pnpm codemod:extract-hooks` dry-run-by-default CLI, `pnpm test` in the commit gate. The codemod deliberately handles GET only and skips-with-reason anything needing intent (mutations, non-primitive locals)."},{"kind":"li","depth":0,"marker":"2.","text":"**Contract layer spanning both repos** — *Done 2026-08-05*, but inverted from the original plan: Zod could not be the origin because nest-setup's CLAUDE.md mandates class-validator DTOs. Origin is the Nest DTOs → `pnpm openapi` emits `openapi.json` → next-setup's `pnpm contract` generates `lib/contract/{schemas,routes}.ts` (Zod + `z.infer` + route builders). Success condition verified by actually renaming `CreateUserDto.fullName` and watching next-setup's type-check fail.\nExtended 2026-09-06 to cover **responses**, which the first pass omitted entirely. `@ApiEnvelope(Dto)` in `src/common/decorators/` wraps a model in the response envelope for Swagger (`ApiExtraModels` + `getSchemaPath` + `allOf` — the only way a generic wrapper is expressible in OpenAPI). The generator unwraps that `allOf` and brands each route builder as `Endpoint\u003cTResponse>`, a phantom-typed string, so `query.get(routes.usersFindOne(id))` infers `ApiResponse\u003cUserResponseDto>` with no type argument. `pnpm contract:check` regenerates, diffs, and fails `pre-push` — regeneration is no longer left to memory.\nStill open: only some generated schemas have consumers, so renaming a field on an unconsumed DTO still breaks nothing in `next-setup` even after regenerating.","raw":"2. **Contract layer spanning both repos** — *Done 2026-08-05*, but inverted from the original plan: Zod could not be the origin because nest-setup's CLAUDE.md mandates class-validator DTOs. Origin is the Nest DTOs → `pnpm openapi` emits `openapi.json` → next-setup's `pnpm contract` generates `lib/contract/{schemas,routes}.ts` (Zod + `z.infer` + route builders). Success condition verified by actually renaming `CreateUserDto.fullName` and watching next-setup's type-check fail.\n   Extended 2026-09-06 to cover **responses**, which the first pass omitted entirely. `@ApiEnvelope(Dto)` in `src/common/decorators/` wraps a model in the response envelope for Swagger (`ApiExtraModels` + `getSchemaPath` + `allOf` — the only way a generic wrapper is expressible in OpenAPI). The generator unwraps that `allOf` and brands each route builder as `Endpoint\u003cTResponse>`, a phantom-typed string, so `query.get(routes.usersFindOne(id))` infers `ApiResponse\u003cUserResponseDto>` with no type argument. `pnpm contract:check` regenerates, diffs, and fails `pre-push` — regeneration is no longer left to memory.\n   Still open: only some generated schemas have consumers, so renaming a field on an unconsumed DTO still breaks nothing in `next-setup` even after regenerating."},{"kind":"li","depth":0,"marker":"3.","text":"**RSC internals** — parse a Flight payload from their own running app by hand, no library, before touching PPR or `use cache`.","raw":"3. **RSC internals** — parse a Flight payload from their own running app by hand, no library, before touching PPR or `use cache`."},{"kind":"li","depth":0,"marker":"4.","text":"**Local-first sync engine** — mutation log, idempotency keys, replay, then deliberately break last-write-wins.","raw":"4. **Local-first sync engine** — mutation
